[workspace]
resolver = "3"
members = [
  "crates/studio-ui",
  "crates/levi-ui",
  "crates/levi-ui-gen",
  "crates/levi-i18n",
  "crates/levi-i18n-tool",
  "crates/levi-rules",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_kittest = { version = "=0.37.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
curia = "=0.2.2"
# egui writes its warnings through `log`; levi-ui's tests read them
log = "0.4.34"
thiserror = "2.0.21"
tempfile = "3.27.0"
studio-ui = { path = "crates/studio-ui" }
levi-ui = { path = "crates/levi-ui" }
levi-i18n = { path = "crates/levi-i18n" }
levi-rules = { path = "crates/levi-rules" }
icu_plurals = "2.2"
icu_locale_core = "2.2"
# `sync` makes ICU data payloads use Arc, so a Localizer can live in egui's context data
icu_provider = { version = "2.3", features = ["sync"] }
polib = "0.3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
